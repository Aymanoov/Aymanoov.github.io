<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب مصعد جديد</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .item-row input {
            flex: 1;
        }
    </style>
</head>
<body>
    <h3>📋 نموذج طلب تسعير</h3>
    
    <div class="form-group">
        <label>اسم العميل</label>
        <input type="text" id="client_name" placeholder="أدخل الاسم بالكامل">
    </div>

    <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" id="client_phone" placeholder="01xxxxxxxxx">
    </div>

    <div class="form-group">
        <label>نوع المصعد</label>
        <select id="elevator_type">
            <option value="هيدروليك">هيدروليك</option>
            <option value="جيرليس">جيرليس (MRL)</option>
            <option value="عادي">عادي (ترقيع)</option>
        </select>
    </div>

    <div class="form-group">
        <label>عدد الأدوار</label>
        <input type="number" id="stops" value="2" min="2">
    </div>

    <div id="items-container">
        <label>المنتجات المطلوبة (اختياري)</label>
        <div class="item-row">
            <input type="text" placeholder="كود المنتج (مثال: MOTOR-01)" class="prod-id">
            <input type="number" placeholder="الكمية" value="1" class="prod-qty" style="width: 80px;">
        </div>
    </div>
    <button type="button" onclick="addItem()" style="background-color: #555; font-size: 12px; width: auto; padding: 5px 10px;">+ إضافة منتج آخر</button>

    <div class="form-group" style="margin-top: 20px;">
        <label>ملاحظات عامة</label>
        <textarea id="notes" rows="3"></textarea>
    </div>

    <button id="send-btn">إرسال الطلب</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function addItem() {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" placeholder="كود المنتج" class="prod-id">
                <input type="number" placeholder="الكمية" value="1" class="prod-qty" style="width: 80px;">
            `;
            container.appendChild(row);
        }

        document.getElementById('send-btn').addEventListener('click', () => {
            const items = [];
            document.querySelectorAll('.item-row').forEach(row => {
                const id = row.querySelector('.prod-id').value;
                const qty = row.querySelector('.prod-qty').value;
                if (id) {
                    items.push({ product_id: id, quantity: parseInt(qty) });
                }
            });

            const data = {
                action: "web_app_multi_order",
                client_name: document.getElementById('client_name').value,
                client_phone: document.getElementById('client_phone').value,
                elevator_type: document.getElementById('elevator_type').value,
                stops: document.getElementById('stops').value,
                customer_general_notes: document.getElementById('notes').value,
                items: items
            };

            if (!data.client_name || !data.client_phone) {
                alert("يرجى ملء الاسم ورقم الهاتف");
                return;
            }

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
